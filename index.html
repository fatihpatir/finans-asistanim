<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finans Günlüğüm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="dark-theme theme-blue">
    <div id="app">
        
        <header>
            <div class="header-top-row">
                <h1>Finans Günlüğüm</h1>
                <div class="header-btns">
                    <button id="install-btn" class="icon-btn-small hidden"><i class="ph ph-download-simple"></i></button>
                    <button id="theme-toggle" class="icon-btn-small"><i class="ph ph-palette"></i></button>
                </div>
            </div>
            
            <div id="theme-menu" class="theme-menu hidden">
                <button class="theme-opt blue" onclick="setTheme('theme-blue')"></button>
                <button class="theme-opt emerald" onclick="setTheme('theme-emerald')"></button>
                <button class="theme-opt rose" onclick="setTheme('theme-rose')"></button>
                <button class="theme-opt amber" onclick="setTheme('theme-amber')"></button>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="top-nav">
            <button class="nav-item active" data-tab="journal">Günlük Defter</button>
            <button class="nav-item" data-tab="portfolio">Portföy Detayı</button>
        </nav>

        <!-- Page 1: Daily Journal -->
        <div id="journal-page" class="page">
            <div class="quick-add-card">
                <div class="card-header-flex">
                    <h3>Bugünkü Toplam Bakiye</h3>
                    <div class="target-setting">
                        <label>Günlük Hedef %</label>
                        <input type="number" id="target-rate-input" value="0.10" step="0.01">
                    </div>
                </div>
                <div class="input-stack">
                    <input type="number" id="daily-total-input" placeholder="Güncel Param (₺)" step="any">
                    <div class="input-row-sub">
                        <input type="number" id="daily-add-input" placeholder="Para Ekle (+)" step="any">
                        <input type="number" id="daily-withdraw-input" placeholder="Para Çek (-)" step="any">
                    </div>
                    <div class="input-row-sub">
                        <input type="date" id="daily-date-input">
                        <button id="save-daily-btn">Kaydı Tamamla <i class="ph-fill ph-check-circle"></i></button>
                    </div>
                </div>
            </div>

            <div id="monthly-summary-container"></div>

            <div id="journal-list"></div>
        </div>

        <!-- Page 2: Portfolio Details -->
        <div id="portfolio-page" class="page hidden">
            <div class="port-actions">
                <button id="fetch-prices-btn" class="btn-secondary-small">
                    <i class="ph ph-arrows-clockwise"></i> Fiyatları İnternetten Güncelle
                </button>
            </div>

            <div class="card portfolio-card">
                <h3><i class="ph ph-coins"></i> Para Piyasası Fonu</h3>
                <div class="port-grid">
                    <div class="field">
                        <label>Adet (Lot)</label>
                        <input type="number" id="p-fon-lot" class="port-input" placeholder="0">
                    </div>
                    <div class="field">
                        <label>Maliyet</label>
                        <input type="number" id="p-fon-cost" class="port-input" placeholder="0.00">
                    </div>
                    <div class="field">
                        <label>Güncel Fiyat</label>
                        <input type="number" id="p-fon-price" class="port-input" placeholder="0.00">
                    </div>
                    <div class="field">
                        <label>Değer</label>
                        <span id="p-fon-value" class="calc-val">₺0.00</span>
                    </div>
                </div>
            </div>

            <div class="card portfolio-card">
                <h3><i class="ph ph-chart-line-up"></i> BFREN Hisse</h3>
                <div class="port-grid">
                    <div class="field">
                        <label>Adet (Lot)</label>
                        <input type="number" id="p-bfren-lot" class="port-input" placeholder="0">
                    </div>
                    <div class="field">
                        <label>Maliyet</label>
                        <input type="number" id="p-bfren-cost" class="port-input" placeholder="0.00">
                    </div>
                    <div class="field">
                        <label>Güncel Fiyat</label>
                        <input type="number" id="p-bfren-price" class="port-input" placeholder="0.00">
                    </div>
                    <div class="field">
                        <label>Değer</label>
                        <span id="p-bfren-value" class="calc-val">₺0.00</span>
                    </div>
                </div>
            </div>

            <div class="card portfolio-card">
                <h3><i class="ph ph-chart-line-up"></i> TARKIM Hisse</h3>
                <div class="port-grid">
                    <div class="field">
                        <label>Adet (Lot)</label>
                        <input type="number" id="p-tarkim-lot" class="port-input" placeholder="0">
                    </div>
                    <div class="field">
                        <label>Maliyet</label>
                        <input type="number" id="p-tarkim-cost" class="port-input" placeholder="0.00">
                    </div>
                    <div class="field">
                        <label>Güncel Fiyat</label>
                        <input type="number" id="p-tarkim-price" class="port-input" placeholder="0.00">
                    </div>
                    <div class="field">
                        <label>Değer</label>
                        <span id="p-tarkim-value" class="calc-val">₺0.00</span>
                    </div>
                </div>
            </div>

            <div class="total-calc-box">
                <span>Hesaplanan Toplam:</span>
                <strong id="p-total-value">₺0.00</strong>
            </div>

            <button id="save-portfolio-btn" class="btn-primary-large" style="margin-top:20px">
                <i class="ph-fill ph-floppy-disk"></i> Portföyü Kaydet ve Hesapla
            </button>
            
            <button id="global-reset-btn">Verileri Sıfırla</button>
        </div>

        <footer class="app-footer">
            <a href="https://fatihpatir.github.io/web" target="_blank">
                <i class="ph ph-code"></i> Fatih PATIR tarafından geliştirildi
            </a>
        </footer>

    </div>

    <!-- Modals -->
    <div id="modal-container" class="hidden">
        <div class="modal-content">
            <button id="close-modal"><i class="ph ph-x"></i></button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
